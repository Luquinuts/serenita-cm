    runner: vitest
    command: npm test
    watch: npm run test:watch
    layers:
      unit: { available: true, tool: vitest }
      integration: { available: true, tool: "@testing-library/react" }
      e2e: { available: false, tool: null }
    coverage:
      available: true
      command: vitest --coverage
    quality:
      type_checker: { available: true, tool: tsc }
      linter: { available: false, tool: null }
      formatter: { available: false, tool: null }

  backend:
    runner: pytest
    command: pytest
    layers:
      unit: { available: true, tool: pytest }
      integration: { available: true, tool: httpx }
      e2e: { available: false, tool: null }
    coverage:
      available: false
      command: null
    quality:
      type_checker: { available: true, tool: mypy }   # .mypy_cache present
      linter: { available: true, tool: ruff }           # .ruff_cache present
      formatter: { available: false, tool: null }

phases:
  propose: { require_issue: false }
  spec: { require_approval: false }
  design: { require_approval: false }
  tasks: { strict_tdd: true }
  apply: { require_tests: true }
  verify: { require_all_tests_pass: true }
  archive: { require_verified: true }
