# OpenSpec — Serenita CM
# Auto-generated by sdd-init
context: |
  Serenita CM: app web editorial para balances mensuales de redes sociales.
  React + TypeScript + Vite frontend, Python FastAPI backend, Supabase DB.
  Generación de PDF con Jinja2 + WeasyPrint. Autenticación con Supabase Auth.
  Integración OAuth con Meta (Instagram). Asistente IA con OpenAI + Gemini.

strict_tdd: true

testing:
